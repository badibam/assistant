<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pistes de thème 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Shippori+Mincho:wght@400;700&family=Oswald:wght@500;600&family=Share+Tech+Mono&family=Rubik+Mono+One&family=Space+Mono:wght@400;700&family=Overpass:wght@500;700;800&family=Pixelify+Sans:wght@400;600&family=Architects+Daughter&family=IBM+Plex+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
/* The page around the boards */
html { background: #ecebe6; color: #1f1e1d; font: 14px/1.45 system-ui, sans-serif; }
body { margin: 0; padding: 40px 32px 64px; }
.page-head { max-width: 1000px; margin-bottom: 36px; }
.page-head h1 { margin: 0 0 6px; font-size: 28px; }
.page-head p { margin: 0; color: #55534e; }
.boards { display: flex; flex-wrap: wrap; gap: 56px 48px; }
figure { margin: 0; width: 390px; display: flex; flex-direction: column; gap: 10px; }
figcaption h2 { margin: 0; font-size: 18px; }
figcaption p { margin: 2px 0 0; color: #55534e; min-height: 3em; }

/* The same zone screen in every track: only the theme's rules below change it */
.phone { width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; border-radius: 28px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.phone * { box-sizing: border-box; }
.phone svg { fill: none; stroke: currentColor; stroke-width: var(--sw, 2); stroke-linecap: round; stroke-linejoin: round; }
.bar { display: flex; align-items: center; gap: 8px; padding: 18px 14px 6px; }
.bar h1 { flex: 1; margin: 0; text-align: center; }
.ib { width: 46px; height: 46px; flex: none; display: flex; align-items: center; justify-content: center; border: 0; padding: 0; background: none; color: inherit; font: inherit; }
.group { display: flex; align-items: center; gap: 8px; padding: 12px 18px 0; }
.rule { flex: 1; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 80px; gap: 12px 10px; padding: 10px 14px 0; }
.w2 { grid-column: span 2; } .w4 { grid-column: span 4; } .h2 { grid-row: span 2; }
.tile { position: relative; padding: 6px 12px; display: flex; flex-direction: column; min-width: 0; }
.th { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.bars { flex: 1; display: flex; align-items: flex-end; gap: 12px; position: relative; padding: 4px 4px 0; }
.bars i { flex: 1; height: calc(var(--h) * 100%); }
.target { position: absolute; left: 0; right: 0; bottom: 58%; }
.days { display: flex; gap: 12px; padding: 2px 4px 0; }
.days span { flex: 1; text-align: center; }
.list ul { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.list li { display: flex; gap: 8px; align-items: center; }
.box { width: 16px; height: 16px; flex: none; position: relative; }
.tags { display: flex; gap: 6px; margin-top: 6px; }
.gauge { height: 14px; margin: 6px 0 2px; position: relative; overflow: hidden; }
.gauge span { display: block; height: 100%; width: 71%; }
.icon { align-items: center; justify-content: center; }
.ic { display: flex; align-items: center; justify-content: center; }
.wait { position: absolute; top: -6px; right: -4px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
.note { margin: 10px 14px 0; height: 80px; }
.note p { margin: 0; }
.fab { position: absolute; right: 18px; bottom: 26px; width: 64px; height: 64px; border: 0; padding: 0; display: flex; align-items: center; justify-content: center; }

/* 1. Swiss: a strict grid, black and white and one red, the figures as the heroes */
.t-swiss { background: #f2f0eb; color: #111; font-family: 'Archivo', sans-serif; --sw: 1.6; }
.t-swiss .bar { padding: 22px 14px 0; }
.t-swiss .bar h1 { text-align: left; font-size: 46px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; padding-left: 4px; }
.t-swiss .bar .more { order: 3; }
.t-swiss .group { padding-top: 18px; }
.t-swiss .gt { font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
.t-swiss .gt::before { content: "01 "; color: #e8331c; }
.t-swiss .group.g2 .gt::before { content: "02 "; }
.t-swiss .rule { height: 1px; background: #111; }
.t-swiss .tile { border-top: 3px solid #111; padding: 6px 0 0; }
.t-swiss .name { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.t-swiss .val { font-size: 22px; font-weight: 900; letter-spacing: -0.03em; }
.t-swiss .big { font-size: 38px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; margin-top: 2px; }
.t-swiss .sub { font-size: 12px; color: #555; }
.t-swiss .bars i { background: #111; }
.t-swiss .bars i:last-of-type { background: #e8331c; }
.t-swiss .target { border-top: 1px solid #e8331c; }
.t-swiss .days { font-size: 11px; font-weight: 600; }
.t-swiss .list li { font-size: 15px; }
.t-swiss .box { border: 2px solid #111; }
.t-swiss .done { color: #888; text-decoration: line-through; }
.t-swiss .done .box { background: #111; }
.t-swiss .tag { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
.t-swiss .tag::before { content: ""; width: 8px; height: 8px; background: #e8331c; }
.t-swiss .tag.b::before { background: #111; }
.t-swiss .gauge { height: 6px; background: #d4d1c9; margin-top: 10px; }
.t-swiss .gauge span { background: #111; }
.t-swiss .icon { border-top: 0; background: #111; color: #f2f0eb; }
.t-swiss .icon.water { background: #e8331c; }
.t-swiss .ic svg { width: 34px; height: 34px; }
.t-swiss .wait { top: 0; right: 0; background: #e8331c; color: #fff; font-weight: 900; }
.t-swiss .note p { font-size: 15px; }
.t-swiss .fab { background: #e8331c; color: #fff; right: 14px; }

/* 2. Ink and wash: cream paper, black ink and a seal red, much empty space */
.t-ink { background: #f3eee2 radial-gradient(ellipse at 20% 10%, rgba(120,100,60,.06), transparent 60%); color: #1d1c1a; font-family: 'Shippori Mincho', serif; --sw: 1.3; }
.t-ink .bar h1 { font-size: 30px; font-weight: 700; letter-spacing: .12em; display: flex; justify-content: center; align-items: center; gap: 10px; }
.t-ink .bar h1::after { content: "S"; width: 26px; height: 26px; background: #b0372a; color: #f3eee2; font-size: 15px; letter-spacing: 0; display: flex; align-items: center; justify-content: center; border-radius: 3px 5px 2px 6px; }
.t-ink .group { padding-top: 22px; }
.t-ink .gt { font-size: 16px; font-weight: 700; letter-spacing: .1em; }
.t-ink .rule { height: 3px; background: #1d1c1a; clip-path: polygon(0 40%, 70% 0, 100% 55%, 70% 100%, 0 70%); opacity: .8; }
.t-ink .tile { background: radial-gradient(ellipse at 35% 45%, rgba(29,28,26,.075), rgba(29,28,26,.03) 55%, transparent 75%); border-radius: 40% 55% 45% 50% / 30% 40% 35% 45%; padding: 8px 14px; }
.t-ink .name { font-size: 15px; font-weight: 700; letter-spacing: .06em; }
.t-ink .val { font-size: 14px; color: #b0372a; }
.t-ink .big { font-size: 26px; line-height: 1.15; }
.t-ink .sub { font-size: 12px; color: #6d6860; }
.t-ink .bars { gap: 18px; padding: 4px 14px 0; }
.t-ink .bars i { background: linear-gradient(#1d1c1a, #1d1c1a) 50% 0 / 6px 100% no-repeat; opacity: .85; }
.t-ink .bars i:last-of-type { background: linear-gradient(#b0372a, #b0372a) 50% 0 / 6px 100% no-repeat; opacity: 1; }
.t-ink .target { border-top: 1px dotted #1d1c1a; opacity: .5; }
.t-ink .days { font-size: 12px; color: #6d6860; gap: 18px; padding: 2px 14px 0; }
.t-ink .list li { font-size: 15px; }
.t-ink .box { border: 1.5px solid #1d1c1a; border-radius: 50% 45% 55% 40%; }
.t-ink .done { color: #8f8a80; }
.t-ink .done .box { border-color: transparent; background: #b0372a; border-radius: 3px 5px 2px 6px; }
.t-ink .tag { font-size: 13px; }
.t-ink .tag::before { content: "・"; color: #b0372a; }
.t-ink .gauge { height: 8px; overflow: visible; margin-top: 10px; }
.t-ink .gauge span { background: #1d1c1a; clip-path: polygon(0 50%, 4% 0, 92% 20%, 100% 55%, 90% 100%, 3% 90%); }
.t-ink .icon { background: none; }
.t-ink .ic svg { width: 32px; height: 32px; }
.t-ink .wait { background: #b0372a; color: #f3eee2; border-radius: 50%; font-size: 14px; top: 4px; right: 6px; }
.t-ink .note p { font-size: 14px; line-height: 1.5; }
.t-ink .fab { background: #1d1c1a; color: #f3eee2; border-radius: 48% 52% 50% 46%; }

/* 3. Analog instruments: dials with needles, lamps, a black panel with screws */
.t-gauge { background: #2b2e2c repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px); color: #d8d1bd; font-family: 'Oswald', sans-serif; --sw: 2; }
.t-gauge .bar h1 { flex: none; margin: 0 auto; font-size: 18px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: #2b2e2c; background: linear-gradient(#e2ddcf, #b9b3a2); padding: 4px 18px 4px 22px; border-radius: 3px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
.t-gauge .ib { border-radius: 50%; background: radial-gradient(circle at 40% 35%, #4a4e4b, #1a1c1b); box-shadow: 0 0 0 2px #111, 0 0 0 3px #555; }
.t-gauge .gt { font-size: 12px; letter-spacing: .25em; text-transform: uppercase; color: #a39d8b; }
.t-gauge .rule { height: 1px; background: #555; }
.t-gauge .tile { background: #1b1d1c; border: 2px solid #474b48; border-radius: 6px; box-shadow: inset 0 2px 6px rgba(0,0,0,.6); padding: 6px 10px; }
.t-gauge .tile::after { content: ""; position: absolute; inset: 3px; pointer-events: none; background: radial-gradient(circle, #6a6e6b 1.6px, transparent 2px) 0 0 / 100% 100% no-repeat, radial-gradient(circle at 3px 3px, #6a6e6b 1.6px, transparent 2px), radial-gradient(circle at calc(100% - 3px) 3px, #6a6e6b 1.6px, transparent 2px), radial-gradient(circle at 3px calc(100% - 3px), #6a6e6b 1.6px, transparent 2px), radial-gradient(circle at calc(100% - 3px) calc(100% - 3px), #6a6e6b 1.6px, transparent 2px); background-size: 0 0, auto, auto, auto, auto; }
.t-gauge .name { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #a39d8b; }
.t-gauge .val, .t-gauge .big { font-family: 'Share Tech Mono', monospace; color: #ffb347; text-shadow: 0 0 6px rgba(255,170,60,.45); background: #120d05; border-radius: 3px; padding: 0 6px; }
.t-gauge .big { font-size: 24px; align-self: flex-start; margin-top: 2px; }
.t-gauge .sub { font-size: 11px; color: #8a8576; font-family: 'Share Tech Mono', monospace; }
.t-gauge .bars { background: #120d05; border-radius: 3px; margin-top: 4px; padding: 6px 8px 4px; gap: 8px; }
.t-gauge .bars i { background: repeating-linear-gradient(to top, #ffb347 0 4px, transparent 4px 6px); opacity: .65; }
.t-gauge .bars i:last-of-type { opacity: 1; filter: drop-shadow(0 0 3px rgba(255,170,60,.7)); }
.t-gauge .target { border-top: 1px solid #ff5a3c; bottom: 56%; }
.t-gauge .days { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #8a8576; gap: 8px; padding: 2px 8px 0; }
.t-gauge .list li { font-size: 14px; letter-spacing: .05em; }
.t-gauge .box { border-radius: 50%; background: radial-gradient(circle at 40% 35%, #3a3d3b, #151615); box-shadow: 0 0 0 2px #3c403d; }
.t-gauge .done { color: #8a8576; }
.t-gauge .done .box { background: radial-gradient(circle at 40% 35%, #c9ffb8, #45d35a 60%); box-shadow: 0 0 0 2px #3c403d, 0 0 8px rgba(90,230,110,.7); }
.t-gauge .tag { font-size: 11px; letter-spacing: .15em; text-transform: uppercase; border: 1px solid #5a5e5b; border-radius: 2px; padding: 0 6px; }
.t-gauge .tag.a { color: #ffb347; }
.t-gauge .tile.pas { flex-direction: row; flex-wrap: wrap; align-items: center; column-gap: 8px; }
.t-gauge .tile.pas .name { width: 100%; }
.t-gauge .gauge { width: 64px; height: 34px; margin: 0; overflow: hidden; border-radius: 64px 64px 0 0; background: conic-gradient(from -90deg at 50% 100%, #ffb347 0 128deg, #3a3d3b 128deg 180deg, transparent 180deg); }
.t-gauge .gauge::before { content: ""; position: absolute; left: 7px; right: 7px; top: 7px; bottom: -27px; border-radius: 50%; background: #1b1d1c; }
.t-gauge .gauge span { position: absolute; left: calc(50% - 1px); bottom: 0; width: 2px !important; height: 30px; background: #f2ede0; transform-origin: 50% 100%; transform: rotate(38deg); }
.t-gauge .icon .ic { width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #3a4a52, #11181c); box-shadow: 0 0 0 3px #3c403d; color: #8fd3f0; }
.t-gauge .sleep .ic { color: #c3b2ff; }
.t-gauge .ic svg { width: 26px; height: 26px; }
.t-gauge .wait { background: radial-gradient(circle at 40% 35%, #ffb1a0, #e53b20 60%); color: #fff; border-radius: 50%; font-size: 14px; font-weight: 600; box-shadow: 0 0 10px rgba(240,70,40,.8); top: 4px; right: 4px; }
.t-gauge .note p { font-size: 14px; color: #c4bda9; }
.t-gauge .fab { border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ff8a6a, #c42e15 65%); color: #fff; box-shadow: 0 0 0 4px #1b1d1c, 0 0 0 7px #6a6e6b, 0 4px 10px rgba(0,0,0,.6); }

/* 4. Risograph: two fluorescent inks printed a little out of register, halftone dots */
.t-riso { --pink: #ff48b0; --blue: #0078bf; background: #f4f0e6 radial-gradient(rgba(0,0,0,.035) 1px, transparent 1.2px) 0 0 / 4px 4px; color: var(--blue); font-family: 'Space Mono', monospace; --sw: 2.4; }
.t-riso .bar h1 { font-family: 'Rubik Mono One', sans-serif; font-size: 30px; font-weight: 400; text-shadow: 3px 2px 0 var(--pink); mix-blend-mode: multiply; }
.t-riso .gt { font-family: 'Rubik Mono One', sans-serif; font-size: 15px; text-shadow: 2px 1px 0 var(--pink); }
.t-riso .rule { height: 6px; background: radial-gradient(var(--pink) 45%, transparent 50%) 0 0 / 6px 6px; }
.t-riso .tile { border: 2px solid var(--blue); box-shadow: 4px 3px 0 var(--pink); background: #f4f0e6; }
.t-riso .name { font-weight: 700; font-size: 14px; text-transform: uppercase; }
.t-riso .val { background: var(--pink); color: var(--blue); mix-blend-mode: multiply; padding: 0 6px; font-weight: 700; font-size: 13px; }
.t-riso .big { font-family: 'Rubik Mono One', sans-serif; font-size: 22px; text-shadow: 2px 2px 0 var(--pink); margin-top: 2px; }
.t-riso .sub { font-size: 11px; }
.t-riso .bars i { background: radial-gradient(var(--blue) 38%, transparent 42%) 0 0 / 5px 5px; box-shadow: 3px -2px 0 rgba(255,72,176,.55); }
.t-riso .bars i:last-of-type { background: var(--pink); box-shadow: 3px -2px 0 var(--blue); }
.t-riso .target { border-top: 2px dashed var(--blue); }
.t-riso .days { font-size: 11px; font-weight: 700; }
.t-riso .list li { font-size: 14px; }
.t-riso .box { border: 2px solid var(--blue); }
.t-riso .done { text-decoration: line-through var(--pink) 2px; }
.t-riso .done .box { background: var(--pink); transform: translate(2px, -1px); }
.t-riso .tag { background: var(--pink); color: var(--blue); padding: 0 8px; font-size: 12px; font-weight: 700; }
.t-riso .tag.b { background: radial-gradient(var(--pink) 45%, transparent 50%) 0 0 / 4px 4px; }
.t-riso .gauge { border: 2px solid var(--blue); background: radial-gradient(var(--blue) 25%, transparent 30%) 0 0 / 4px 4px; }
.t-riso .gauge span { background: var(--pink); }
.t-riso .icon { background: radial-gradient(var(--pink) 40%, transparent 46%) 0 0 / 5px 5px, #f4f0e6; }
.t-riso .ic { width: 50px; height: 50px; border-radius: 50%; background: #f4f0e6; border: 2px solid var(--blue); box-shadow: 3px 2px 0 var(--pink); }
.t-riso .ic svg { width: 28px; height: 28px; }
.t-riso .wait { background: var(--pink); color: var(--blue); border-radius: 50%; font-weight: 700; box-shadow: 2px 1px 0 var(--blue); }
.t-riso .note p { font-size: 13px; }
.t-riso .fab { border-radius: 50%; background: radial-gradient(var(--pink) 45%, transparent 50%) 0 0 / 5px 5px, #f4f0e6; border: 3px solid var(--blue); color: var(--blue); box-shadow: 4px 3px 0 var(--pink); }

/* 5. Metro signage: each tool a line in its icon's colour, the zone a station */
.t-metro { background: #f6f6f4; color: #14213d; font-family: 'Overpass', sans-serif; --sw: 2.4; }
.t-metro .bar { background: #0b2545; color: #fff; padding: 22px 14px 12px; }
.t-metro .bar h1 { font-size: 26px; font-weight: 800; text-align: left; }
.t-metro .bar .back { order: 0; }
.t-metro .gt { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; gap: 8px; }
.t-metro .gt::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 4px solid #0b2545; background: #fff; }
.t-metro .rule { height: 4px; background: #0b2545; border-radius: 2px; }
.t-metro .tile { background: #fff; border-radius: 4px; border-top: 6px solid var(--line); box-shadow: 0 1px 0 #d9d9d4; padding: 4px 10px; }
.t-metro .chart { --line: #f28c28; --n: "1"; } .t-metro .poids { --line: #1f6fd1; --n: "2"; } .t-metro .list { --line: #2ca05a; --n: "3"; }
.t-metro .journal { --line: #8b4fb3; --n: "4"; } .t-metro .pas { --line: #e6b417; --n: "5"; } .t-metro .water { --line: #1aa0b5; } .t-metro .sleep { --line: #3b4cc0; } .t-metro .note { --line: #9a9a94; --n: "N"; }
.t-metro .name { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.t-metro .name::before { content: var(--n); width: 20px; height: 20px; border-radius: 50%; background: var(--line); color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
.t-metro .val { font-weight: 700; font-size: 14px; }
.t-metro .big { font-size: 26px; font-weight: 800; line-height: 1.1; }
.t-metro .sub { font-size: 12px; color: #5b6170; }
.t-metro .bars i { background: var(--line); border-radius: 3px 3px 0 0; opacity: .55; }
.t-metro .bars i:last-of-type { opacity: 1; }
.t-metro .target { border-top: 2px dashed #0b2545; }
.t-metro .days { font-size: 11px; font-weight: 700; color: #5b6170; }
.t-metro .list li { font-size: 15px; font-weight: 500; }
.t-metro .box { border-radius: 50%; border: 3px solid var(--line); background: #fff; }
.t-metro .done { color: #9a9ea8; text-decoration: line-through; }
.t-metro .done .box { background: var(--line); }
.t-metro .tag { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 3px; color: #fff; background: #8b4fb3; }
.t-metro .tag.b { background: #c2477f; }
.t-metro .gauge { height: 6px; background: #dcdcd6; border-radius: 3px; overflow: visible; margin-top: 12px; }
.t-metro .gauge span { background: var(--line); border-radius: 3px; position: relative; }
.t-metro .gauge span::after { content: ""; position: absolute; right: -6px; top: -4px; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--line); }
.t-metro .icon { border-top: 0; background: var(--line); color: #fff; border-radius: 10px; }
.t-metro .ic svg { width: 34px; height: 34px; }
.t-metro .wait { background: #e2231a; color: #fff; font-weight: 800; border-radius: 50%; box-shadow: 0 0 0 2px #fff; }
.t-metro .note p { font-size: 14px; }
.t-metro .fab { border-radius: 50%; background: #0b2545; color: #fff; box-shadow: 0 0 0 4px #f6f6f4, 0 0 0 7px #0b2545; }

/* 6. 1-bit Mac of the nineties: windows with striped title bars, dithered greys */
.t-mac { background: #fff repeating-conic-gradient(#000 0 25%, #fff 0 50%) 0 0 / 2px 2px; color: #000; font-family: 'Pixelify Sans', sans-serif; --sw: 2; }
.t-mac .bar { background: #fff; border-bottom: 2px solid #000; padding: 16px 10px 4px; }
.t-mac .bar h1 { font-size: 20px; font-weight: 600; }
.t-mac .group { padding: 10px 14px 0; }
.t-mac .gt { background: #fff; border: 2px solid #000; padding: 0 8px; font-size: 15px; font-weight: 600; }
.t-mac .rule { height: 2px; }
.t-mac .tile { background: #fff; border: 2px solid #000; box-shadow: 2px 2px 0 #000; padding: 0 0 4px; }
.t-mac .tile > .name, .t-mac .th { height: 20px; flex: none; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; border-bottom: 2px solid #000; background: repeating-linear-gradient(#fff 0 2px, #000 2px 3px) 0 3px / 100% 14px no-repeat, #fff; position: relative; }
.t-mac .tile > .name::before, .t-mac .th::before { content: ""; position: absolute; left: 8px; top: 2px; width: 12px; height: 12px; background: #fff; border: 2px solid #000; }

<body>
<header class="page-head">
  <h1>Pistes de thème 2</h1>
  <p>Le même écran (la zone Santé) dessiné dans huit registres qui ne sont pas sur la première planche (<code>board-1.html</code>). Seuls les styles changent d'une piste à l'autre ; le contenu est celui de la première planche.</p>
</header>

<main class="boards">
  <figure><figcaption><h2>Suisse</h2><p>Une grille stricte, noir et blanc et un seul rouge, ni ombre ni arrondi : les chiffres en vedette.</p></figcaption><section class="phone t-swiss" aria-label="Thème suisse"></section></figure>
  <figure><figcaption><h2>Encre et lavis</h2><p>Papier crème, encre noire et rouge de sceau, beaucoup de vide ; le seul thème calme.</p></figcaption><section class="phone t-ink" aria-label="Thème encre et lavis"></section></figure>
  <figure><figcaption><h2>Instruments</h2><p>Un panneau noir vissé, des chiffres d'afficheur, des voyants pour les cases, un cadran à aiguille pour la jauge.</p></figcaption><section class="phone t-gauge" aria-label="Thème instruments"></section></figure>
  <figure><figcaption><h2>Risographie</h2><p>Deux encres fluo, rose et bleu, imprimées un peu décalées ; les à-plats en trame de points.</p></figcaption><section class="phone t-riso" aria-label="Thème risographie"></section></figure>
  <figure><figcaption><h2>Signalétique de métro</h2><p>Chaque outil est une ligne dans la couleur de son icône, numérotée ; la zone est une station.</p></figcaption><section class="phone t-metro" aria-label="Thème signalétique de métro"></section></figure>
  <figure><figcaption><h2>Mac 1-bit</h2><p>Chaque tuile est une fenêtre à barre rayée ; les gris sont des trames de pixels noirs et blancs.</p></figcaption><section class="phone t-mac" aria-label="Thème Mac 1-bit"></section></figure>
  <figure><figcaption><h2>Plan d'architecte</h2><p>Des traits blancs sur un quadrillage bleu, des hachures, des cotes, un triangle de révision pour l'attente.</p></figcaption><section class="phone t-blue" aria-label="Thème plan d'architecte"></section></figure>
  <figure><figcaption><h2>Papier découpé</h2><p>Des feuilles de couleur découpées aux ciseaux, posées de travers sur du kraft.</p></figcaption><section class="phone t-paper" aria-label="Thème papier découpé"></section></figure>
</main>

<!-- The zone screen every track draws: the same tiles as on the first board -->
<template id="zone-screen">

</template>
<script>
  // Every track gets its own copy of the zone screen.
  const screen = document.getElementById('zone-screen');
  document.querySelectorAll('.phone').forEach(p => p.appendChild(screen.content.cloneNode(true)));
